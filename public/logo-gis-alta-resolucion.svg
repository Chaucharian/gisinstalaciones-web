<svg width="450" height="120" viewBox="0 0 450 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-gis { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 900; font-size: 72px; fill: #1b1c1c; letter-spacing: 0.05em; }
      .text-inst { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #7d5700; letter-spacing: 0.25em; }
    </style>
  </defs>

  <!-- Gas Flame Icon -->
